<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>マイホームページ</title>
    
    <style>
        /* --- ここからApple風・洗練されたデザイン（CSS） --- */
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, 'Hiragino Kaku Gothic ProN', sans-serif;
            background-color: #000000; /* Apple王道の漆黒 */
            color: #f5f5f7; /* 純白ではない、目に優しい白 */
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
            overflow-x: hidden;
        }

        /* 上部のすりガラス風ナビゲーションバー風の演出 */
        .apple-nav {
            position: fixed;
            top: 0;
            width: 100%;
            height: 48px;
            background-color: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid #333333;
            z-index: 100;
            animation: fadeInDown 0.8s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        /* メインのコンテナ（ポップな枠線や背景を排除） */
        .container {
            max-width: 600px;
            width: 100%;
            padding: 80px 20px 40px 20px; /* ナビバーの分、上に余白 */
            text-align: center;
            box-sizing: border-box;
        }

        /* 登場アニメーションの共通設定 */
        .animate {
            opacity: 0;
            transform: translateY(40px);
            animation: fadeInUp 1.2s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        /* タイトル：大きく、太く、圧倒的主役感 */
        h1 {
            font-size: 48px;
            font-weight: 700;
            color: #ffffff;
            margin: 0 0 16px 0;
            letter-spacing: -0.015em;
            animation-delay: 0.2s; /* 最初に動く */
        }

        /* キャッチコピー：トーンを落とした絶妙なグレー */
        .intro {
            font-size: 21px;
            font-weight: 400;
            color: #86868b;
            margin-bottom: 40px;
            letter-spacing: -0.01em;
            animation-delay: 0.4s; /* 2番目に動く */
        }

        /* リンクナビゲーション */
        nav {
            animation-delay: 0.6s; /* 最後に動く */
        }

        ul {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px; /* ボタン同士の間隔 */
        }

        li {
            width: 100%;
            max-width: 320px; /* ボタンが細長くスマートに見える幅 */
        }

        /* 👇 Appleの「購入」ボタンを意識した美しく青いカプセル型リンク */
        .btn-link {
            display: block;
            background-color: #007aff; /* Apple Blue */
            color: #ffffff;
            text-decoration: none;
            font-weight: 500;
            font-size: 17px;
            padding: 14px 20px;
            border-radius: 980px; /* 完全に滑らかな丸角 */
            transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
        }

        /* マウスを乗せたとき・タップしたときにじわっと濃くなる */
        .btn-link:hover {
            background-color: #0066cc;
            transform: scale(1.02); /* ほんの少しだけ大きくなって吸い付くようなエフェクト */
        }

        .btn-link:active {
            transform: scale(0.98); /* 押した瞬間は少し凹む */
        }

        /* --- アニメーションの軌道定義 --- */
        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>

    <div class="apple-nav"></div>

    <div class="container">
        <h1 class="animate">ようこそ。<br>私のホームページへ。</h1>
        <p class="intro animate">ここはトップページです。目指せ雀王！！</p>

        <nav class="animate">
            <ul>
                <li><a href="MJ_v8.html" class="btn-link">🀄 _点数自動計算（普通） を見る</a></li>
                <li><a href="MJ_pt_list_v6.html" class="btn-link">📝 _点数表(普通)を確認</a></li>
                <li><a href="MJ_v10.html" class="btn-link">🀄 _点数自動計算（Apple風味） を見る</a></li>
                <li><a href="MJ_pt_list_v7.html" class="btn-link">📝 _点数表(Apple風味)を確認</a></li>
            </ul>
        </nav>
    </div>

</body>
</html>
