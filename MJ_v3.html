<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>麻雀点数計算アプリ - UIアップデート版</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Helvetica Neue', Arial, sans-serif;
        }

        body {
            background-color: #f0f4f8;
            padding: 20px 10px;
            display: flex;
            justify-content: center;
        }

        .app-container {
            width: 100%;
            max-width: 450px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
            padding: 20px;
        }

        header h1 {
            font-size: 18px;
            color: #1b4d3e;
            text-align: center;
            margin-bottom: 20px;
        }

        /* ① 計算結果エリア */
        .status-card {
            background: #e6f4ea;
            border: 1px solid #a3cfbb;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
            text-align: center;
        }

        .result-display {
            font-size: 20px;
            font-weight: bold;
            color: #137333;
            margin-bottom: 5px;
        }

        /* ② 条件設定エリア（プルダウン化・項目追加） */
        .config-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            background: #f7fafc;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
        }

        .config-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .config-group label {
            font-size: 11px;
            font-weight: bold;
            color: #718096;
        }

        /* プルダウン（セレクトボックス）のスタイリング */
        .config-select {
            width: 100%;
            padding: 8px 10px;
            font-size: 14px;
            border: 1px solid #cbd5e0;
            border-radius: 6px;
            background-color: white;
            color: #2d3748;
            cursor: pointer;
            outline: none;
        }

        .config-select:focus {
            border-color: #1b4d3e;
            box-shadow: 0 0 0 2px rgba(27, 77, 62, 0.1);
        }

        /* ③ 手牌表示エリア */
        .section-title {
            font-size: 14px;
            font-weight: bold;
            color: #4a5568;
            margin-bottom: 8px;
        }

        .hand-container {
            background: #f7fafc;
            border: 2px dashed #cbd5e0;
            border-radius: 12px;
            padding: 12px 8px;
            min-height: 70px;
            display: flex;
            gap: 4px;
            overflow-x: auto;
            margin-bottom: 20px;
        }

        /* 麻雀牌のデザイン */
        .tile {
            width: 32px;
            height: 44px;
            background: #fff;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-shadow: 0 3px 0 #bbb, inset 0 -2px 5px rgba(0,0,0,0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            cursor: pointer;
            user-select: none;
        }

        .tile:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #bbb;
        }

        .hand-tile {
            border-bottom: 3px solid #e57373;
        }

        .placeholder {
            color: #a0aec0;
            font-size: 13px;
            width: 100%;
            text-align: center;
            line-height: 44px;
        }

        /* ④ 牌選択エリア */
        .selection-panel {
            background: #edf2f7;
            border-radius: 12px;
            padding: 12px;
        }

        .tabs {
            display: flex;
            gap: 5px;
            margin-bottom: 10px;
        }

        .tab-btn {
            flex: 1;
            padding: 8px;
            background: #e2e8f0;
            border: none;
            border-radius: 6px 6px 0 0;
            cursor: pointer;
            font-weight: bold;
            font-size: 12px;
        }

        .tab-btn.active {
            background: white;
            color: #1b4d3e;
        }

        .tile-grid {
            display: grid;
            grid-template-columns: repeat(9, 1fr);
            gap: 6px;
            background: white;
            padding: 10px;
            border-radius: 0 0 8px 8px;
        }

        .tile-grid.jihai {
            grid-template-columns: repeat(7, 1fr);
        }

        .manzu .tile { color: #d32f2f; }
        .pinzu .tile { color: #1976d2; }
        .sozu .tile { color: #388e3c; }
        .jihai .tile { color: #4a148c; }

        .control-btns {
            margin-top: 15px;
            display: flex;
            gap: 10px;
        }

        .action-btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        .clear-btn { background: #e57373; color: white; }
        .calc-btn { background: #2e7d32; color: white; }
    </style>
</head>
<body>

<div class="app-container">
    <header>
        <h1>🀄 麻雀点数計算 - 入力UI強化版</h1>
    </header>

    <div class="status-card">
        <div class="result-display" id="resultText">手牌を14枚選んでください</div>
    </div>

    <div class="config-grid">
        <div class="config-group">
            <label for="selectKaze">場風 / 自風</label>
            <select class="config-select" id="selectKaze">
                <option value="ton-ton">東場 / 東家 (親)</option>
                <option value="ton-nan">東場 / 南家 (子)</option>
                <option value="ton-sha">東場 / 西家 (子)</option>
                <option value="ton-pei">東場 / 北家 (子)</option>
                <option value="nan-ton">南場 / 東家 (親)</option>
                <option value="nan-nan">南場 / 南家 (子)</option>
            </select>
        </div>

        <div class="config-group">
            <label for="selectAgari">アガリ方</label>
            <select class="config-select" id="selectAgari">
                <option value="ron">ロンアガリ</option>
                <option value="tsumo">ツモアガリ</option>
            </select>
        </div>

        <div class="config-group">
            <label for="selectMachi">待ち方（符計算用）</label>
            <select class="config-select" id="selectMachi">
                <option value="ryammen">両面 / シャボ待ち (+0符)</option>
                <option value="tarki">単騎 / カン / ペン (+2符)</option>
            </select>
        </div>

        <div class="config-group">
            <label for="selectDora">ドラの数</label>
            <select class="config-select" id="selectDora">
                <option value="0">なし</option>
                <option value="1">ドラ 1</option>
                <option value="2">ドラ 2</option>
                <option value="3">ドラ 3</option>
                <option value="4">ドラ 4</option>
                <option value="5">ドラ 5</option>
            </select>
        </div>
    </div>

    <div class="section-title">現在の手牌 (<span id="tileCount">0</span>/14枚)</div>
    <div class="hand-container" id="handContainer" onclick="removeTile(event)">
        <div class="placeholder" id="placeholder">下のパネルから牌をタップして追加</div>
    </div>

    <div class="selection-panel">
        <div class="tabs">
            <button class="tab-btn active" id="tab-manzu" onclick="switchTab('manzu')">萬子</button>
            <button class="tab-btn" id="tab-pinzu" onclick="switchTab('pinzu')">筒子</button>
            <button class="tab-btn" id="tab-sozu" onclick="switchTab('sozu')">索子</button>
            <button class="tab-btn" id="tab-jihai" onclick="switchTab('jihai')">字牌</button>
        </div>

        <div class="tile-grid manzu" id="gridContainer">
            </div>

        <div class="control-btns">
            <button class="action-btn clear-btn" onclick="clearHand()">全消去</button>
            <button class="action-btn calc-btn" onclick="startCalculation()">点数計算</button>
        </div>
    </div>
</div>

<script>
    let currentHand = [];
    let currentTab = 'manzu';

    const tilesData = {
        manzu: ['🀇', '🀈', '🀉', '🀊', '🀋', '🀌', '🀍', '🀎', '🀏'],
        pinzu: ['🀙', '🀚', '🀛', '🀜', '🀝', '🀞', '🀟', '🀠', '🀡'],
        sozu:  ['🀐', '🀑', '🀒', '🀓', '🀔', '🀕', '🀖', '🀗', '🀘'],
        jihai: ['🀀', '🀁', '🀂', '🀃', '🀆', '🀅', '🀄']
    };

    function renderGrid() {
        const grid = document.getElementById('gridContainer');
        grid.innerHTML = '';
        grid.className = `tile-grid ${currentTab}`;

        tilesData[currentTab].forEach(tileSymbol => {
            const tileDiv = document.createElement('div');
            tileDiv.className = 'tile';
            tileDiv.innerText = tileSymbol;
            tileDiv.onclick = () => addTile(tileSymbol);
            grid.appendChild(tileDiv);
        });
    }

    function switchTab(tabName) {
        currentTab = tabName;
        ['manzu', 'pinzu', 'sozu', 'jihai'].forEach(t => {
            document.getElementById(`tab-${t}`).classList.remove('active');
        });
        document.getElementById(`tab-${tabName}`).classList.add('active');
        renderGrid();
    }

    function addTile(tileSymbol) {
        if (currentHand.length >= 14) {
            alert('手牌は最大14枚です！');
            return;
        }
        currentHand.push(tileSymbol);
        updateHandUI();
    }

    function removeTile(event) {
        const clickedTile = event.target.closest('.hand-tile');
        if (!clickedTile) return;

        const index = clickedTile.dataset.index;
        currentHand.splice(index, 1);
        updateHandUI();
    }

    function clearHand() {
        currentHand = [];
        updateHandUI();
    }

    function updateHandUI() {
        const container = document.getElementById('handContainer');
        const countSpan = document.getElementById('tileCount');
        countSpan.innerText = currentHand.length;

        if (currentHand.length === 0) {
            container.innerHTML = '<div class="placeholder" id="placeholder">下のパネルから牌をタップして追加</div>';
            document.getElementById('resultText').innerText = "手牌を14枚選んでください";
            return;
        }

        container.innerHTML = '';
        currentHand.forEach((tileSymbol, index) => {
            const tileDiv = document.createElement('div');
            tileDiv.className = 'tile hand-tile';
            tileDiv.innerText = tileSymbol;
            tileDiv.dataset.index = index;
            container.appendChild(tileDiv);
        });

        if (currentHand.length < 14) {
            document.getElementById('resultText').innerText = `あと ${14 - currentHand.length} 枚選んでください`;
        } else {
            document.getElementById('resultText').innerText = "計算の準備完了！";
        }
    }

    // --- 新しい点数計算（プルダウンの値を読み取る仕組み） ---
    function startCalculation() {
        if (currentHand.length < 14) {
            alert('手牌を14枚揃えてください！');
            return;
        }

        // プルダウンから現在の選択値を取得する
        const kazeValue = document.getElementById('selectKaze').value;
        const agariValue = document.getElementById('selectAgari').value;
        const machiValue = document.getElementById('selectMachi').value;
        const doraValue = document.getElementById('selectDora').value;

        // 親か子かを判定（選択肢の文字に「ton-ton」や「nan-ton」のように最後がtonなら親）
        const isOya = kazeValue.endsWith('ton');
        const isRon = (agariValue === 'ron');

        // デモ用の簡易判定
        let score = "";
        if (isOya) {
            score = isRon ? "11,600点 (満貫級)" : "3,900点オール";
        } else {
            score = isRon ? "7,700点" : "2,000 / 3,900点";
        }

        // 追加情報を乗せて結果を表示
        document.getElementById('resultText').innerText = `結果：${score} （ドラ${doraValue}）`;
    }

    renderGrid();
</script>
</body>
</html>
